services:
  - type: web
    name: stockware-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi_app:application --bind 0.0.0.0:$PORT --timeout 120 --log-level debug
    envVars:
      - key: DB_TYPE
        value: MYSQL
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: NOTIFICATION_EMAIL
        value: "bodega.eesoluciones@gmail.com"
